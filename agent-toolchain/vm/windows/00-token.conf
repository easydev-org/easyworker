# AgentWorker: expose the guest-only per-pod env endpoint (/env) on port 8090.
# This listener is NOT published by any Kubernetes Service, and is further
# restricted to the guest subnet (172.30.0.0/24) + loopback, so the token never
# leaves the pod.
server {
    listen 8090;
    server_name _;
    server_tokens off;

    # Only the QEMU guest network and the container itself may read it.
    allow 127.0.0.1;
    allow 172.30.0.0/24;
    deny all;

    # Per-pod env for the guest launcher: WORKER_TOKEN=... and SANDBOX_PROXY=...
    # (KEY=VALUE lines). The guest does not inherit the pod env, so anything it
    # needs — the pre-auth token and the deployment HTTP proxy — travels here.
    location = /env {
        alias /run/shm/env;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Boot-fetch: the guest launcher downloads the current agent-worker binary
    # here on every boot, so a worker upgrade is an image change, not a golden
    # disk change. The guest disk still carries a fallback copy.
    location = /worker {
        alias /opt/agent-worker/agent-worker;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # Boot-fetch: the native-a11y (est://) daemon, same route as the worker.
    location = /native-a11y {
        alias /opt/agent-worker/native-a11y;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
    }

    # NOTE: xa11y is NOT served here. It is a STATIC tool baked into the golden
    # disk (C:\Users\Docker\bin\xa11y.exe); the launcher only puts it on PATH.
    # The guest-side worker launcher. `install-worker.cmd` (run inside the guest)
    # refreshes worker-launch.cmd from here, so a launcher change is an image
    # change, not a golden-disk rebake.
    location = /worker-launch.cmd {
        alias /opt/agent-worker/worker-launch.cmd;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # The guest-side SYSTEM-elevation helper (refreshed alongside the launcher).
    location = /ewelevate.cmd {
        alias /opt/agent-worker/ewelevate.cmd;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Toolchain bridge: the guest reaches the in-cluster artifact registry ONLY
    # through this container (its sole reachable host is host.lan:8090), so the
    # worker's on-demand installer fetches toolchains THROUGH here. Big
    # toolchains (rust ~1.5G, julia ~800M) are slow over this hop but work.
    location = /healthz {
        proxy_pass http://artifact.worker.svc.cluster.local/healthz;
    }

    location / {
        return 404;
    }
}
